name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Test (non-UI crates)
        run: cargo test -p smf-core -p document -p commands -p mcp-server --locked
      - name: Build workspace (gpui app needs Windows)
        run: cargo build --workspace --locked

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Formatting
        run: cargo fmt --all -- --check
      # Warning policy: every clippy/rustdoc warning is an error — the tree is
      # clean today and stays clean; exceptions need an in-code allow + comment.
      - name: Clippy (all warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Public docs (all warnings denied)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Dependency policy (advisories, licenses, bans, sources)
        run: cargo deny check
