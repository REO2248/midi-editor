name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Test (non-UI crates)
        run: cargo test -p smf-core -p document -p commands -p mcp-server --locked
      - name: Build workspace (gpui app needs Windows)
        run: cargo build --workspace --locked

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build release workspace
        run: cargo build --release --workspace --locked
      # Assembles dist/ (midi-editor.exe + vst3-host helper/probe + icons +
      # licenses), validates expected files + x64 PE architecture, and runs
      # the packaged binary's --smoke mode. Fails the job on any gap.
      - name: Assemble and validate dist
        run: ./scripts/package_dist.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
