name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Test (non-UI crates)
        run: cargo test -p smf-core -p document -p commands -p mcp-server --locked
      - name: Build workspace (gpui app needs Windows)
        run: cargo build --workspace --locked

  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build bench harness (release)
        run: cargo build --release -p bench --locked
      # --check fails the job on >3x machine-normalized regressions against
      # crates/bench/baseline.json (see crates/bench/src/main.rs header).
      - name: Run benchmarks
        run: ./target/release/midi-bench.exe --check --out target/bench/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: target/bench/results.json
