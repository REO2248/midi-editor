name: Fuzz

# Longer fuzzing runs than the bounded PR smoke in ci.yml. Weekly plus on
# demand with a configurable per-target budget.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      minutes:
        description: Fuzzing budget in minutes per target
        required: false
        default: '30'

jobs:
  fuzz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Cache fuzz target
        uses: actions/cache@v4
        with:
          path: fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-
      - name: Fuzz all targets
        working-directory: fuzz
        shell: pwsh
        env:
          MINUTES: ${{ github.event.inputs.minutes || '30' }}
        run: |
          foreach ($t in 'parse_strict','parse_lenient','parse_write','write_parse','normalize_fixpoint') {
            New-Item -ItemType Directory -Force "corpus/$t" | Out-Null
            cargo fuzz run $t "corpus/$t" corpus/shared corpus/not_strict -- "-max_total_time=$([int]$env:MINUTES * 60)" -rss_limit_mb=2048
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
