[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# local crates
smf-core = { path = "crates/smf-core" }
document = { path = "crates/document" }
commands = { path = "crates/commands" }
midi-io = { path = "crates/midi-io" }
output = { path = "crates/output" }
mcp-server = { path = "crates/mcp-server" }
persist = { path = "crates/persist" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

# MIDI / SMF
midly = "0.5"
midir = "0.11"

# Plugin hosting incl. its cpal audio backend; midir 0.11 allows alsa
# >=0.9,<0.12 so both resolve alsa 0.11 / alsa-sys 0.4 — no links conflict.
vst3-host = { version = "0.9" }
cpal = "0.18.2"

# GUI (gpui via gpui-kit facade; gpui is gpui-pre 0.3.6 underneath)
gpui-kit = "0.6"

# MCP server
rmcp = { version = "3.4", features = ["client", "server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = "0.8"
http = "1"

[profile.dev]
# faster link times during spike work
incremental = true
