[package]
name = "midi-editor"
edition.workspace = true
version.workspace = true
license.workspace = true
authors = ["REO2248"]
description = "Pure-SMF MIDI editor — gpui app"

[dependencies]
gpui-kit.workspace = true
document.workspace = true
smf-core.workspace = true
commands.workspace = true
midi-io.workspace = true
output.workspace = true
mcp-server.workspace = true
persist.workspace = true
vst3-host.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
# HWND for parenting the native file dialogs (#158)
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# common-item dialogs (IFileOpenDialog/IFileSaveDialog) — gpui's prompt
# API exposes no type filter list, so Open/Save-As call COM directly to
# offer "MIDI files" + "All files" like a real Windows document app
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
# turns `TestSupportExt::test_support()` on: elements opted in via
# `.test_support()` expose role/label/state snapshots in test windows.
gpui-kit = { workspace = true, features = ["test-support"] }

[build-dependencies]
# embeds icon + VERSIONINFO into midi-editor.exe (Windows only)
embed-resource = "3"
[[bin]]
name = "midi-editor"
path = "src/main.rs"
