[package]
name = "midi-editor"
edition.workspace = true
license.workspace = true
description = "Pure-SMF MIDI editor — gpui app"

[dependencies]
gpui-kit.workspace = true
document.workspace = true
smf-core.workspace = true
commands.workspace = true
midi-io.workspace = true
output.workspace = true
mcp-server.workspace = true
vst3-host.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# turns `TestSupportExt::test_support()` on: elements opted in via
# `.test_support()` expose role/label/state snapshots in test windows.
gpui-kit = { workspace = true, features = ["test-support"] }

[[bin]]
name = "midi-editor"
path = "src/main.rs"
